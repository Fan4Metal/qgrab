<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QGrab</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="../ui/common.css" />
    <link rel="stylesheet" href="downloader.css" />
    <script type="module" src="downloader.js"></script>
  </head>
  <body>
    <main class="card">
      <header class="head">
        <img src="../../icons/icon48.png" width="40" height="40" alt="" />
        <div class="head-text">
          <h1 id="name"></h1>
          <div id="source" class="muted"></div>
        </div>
      </header>

      <div class="status-row">
        <span id="status"></span>
        <span id="percent" class="muted"></span>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div id="stats" class="muted stats"></div>

      <ul id="warnings" class="warnings"></ul>

      <section id="failed" class="failed" hidden>
        <p id="failed-text"></p>
        <div class="buttons">
          <button id="retry" class="primary" data-i18n="btnRetry"></button>
          <button id="skip" data-i18n="btnSkip"></button>
        </div>
      </section>

      <div class="buttons end">
        <button id="save-again" class="primary" data-i18n="btnSaveAgain" hidden></button>
        <button id="cancel" data-i18n="btnCancel"></button>
        <button id="close" data-i18n="btnClose" hidden></button>
      </div>
    </main>
  </body>
</html>
