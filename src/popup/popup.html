<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QGrab</title>
    <link rel="stylesheet" href="../ui/common.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="top">
      <img src="../../icons/icon32.png" width="20" height="20" alt="" />
      <span class="title" data-i18n="extName"></span>
      <span id="count" class="count"></span>
      <span class="spacer"></span>
      <button id="clear" class="icon-btn" data-i18n-title="btnClear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>
      </button>
      <button id="settings" class="icon-btn" data-i18n-title="btnSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
      </button>
    </header>

    <ul id="list" class="list"></ul>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M10 9.5v5l4-2.5z" /></svg>
      <p data-i18n="popupEmpty"></p>
      <p class="muted" data-i18n="popupEmptyHint"></p>
    </div>

    <template id="item-template">
      <li class="item">
        <div class="kind"></div>
        <div class="body">
          <div class="name-row">
            <input class="name" type="text" spellcheck="false" />
            <span class="ext"></span>
          </div>
          <div class="names" hidden></div>
          <div class="note" hidden></div>
          <div class="actions">
            <select class="quality" hidden></select>
            <span class="meta muted"></span>
            <button class="copy icon-btn" data-i18n-title="btnCopy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" /></svg>
            </button>
            <button class="dl primary" data-i18n="btnDownload"></button>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
